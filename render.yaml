# Render Blueprint — Budget Tracker API
# Docs: https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Connect this repo in the Render dashboard → "New" → "Blueprint".
#   2. Set the sync:false secrets (DATABASE_URL, JWT_*, SMTP_*) in the
#      service's environment panel right after it is created.
#   3. Render starts the service and probes GET /api/v1/health.
services:
  - type: web
    name: budget-tracker-api
    rootDir: apps/api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/v1/health
    envVars:
      # Public defaults.
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: THROTTLE_LIMIT
        value: 5
      - key: THROTTLE_TTL
        value: 60000
      # Secrets — set these in the Render dashboard (or via render CLI).
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false